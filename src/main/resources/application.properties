server.port=${PORT:8081}
spring.application.name=tutoria-springboot

# Base de datos H2 persistente en archivo local (cero configuracion requerida)
spring.datasource.url=jdbc:h2:file:./data/tutoriadb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola de administracion web de la BD
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
