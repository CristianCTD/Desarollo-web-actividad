<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Spring Boot Tutorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 65px; height: 65px;">
                                <i class="bi bi-mortarboard-fill fs-2"></i>
                            </div>
                            <h4 class="fw-bold text-success">Spring Boot Tutorías</h4>
                            <p class="text-muted small">Universidad de Cartagena - Ingeniería de Software</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
                        <div th:if="${param.logout}" class="alert alert-success py-2 small">Sesión cerrada exitosamente.</div>

                        <form th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Correo Institucional</label>
                                <input type="email" name="email" class="form-control" value="admin@unicartagena.edu.co" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Contraseña</label>
                                <input type="password" name="clave" class="form-control" value="admin123" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar (Spring Boot)
                            </button>
                        </form>

                        <div class="text-center">
                            <a th:href="@{/recuperar}" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
