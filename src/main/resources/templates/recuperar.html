<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-success display-4"></i>
                        <h4 class="fw-bold mt-2">Recuperar Acceso</h4>
                    </div>
                    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
                    <div th:if="${mensajeExito}" class="alert alert-success py-2 small" th:text="${mensajeExito}"></div>
                    <form th:action="@{/recuperar}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 mb-3">Enviar Recordatorio</button>
                    </form>
                    <div class="text-center">
                        <a th:href="@{/login}" class="text-decoration-none small">Regresar al Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
