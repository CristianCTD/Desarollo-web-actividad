<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes Parametrizados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/tutorias}">Tutorías Spring Boot</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/tutorias}">Tutorías</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/reportes}">Reportes</a></li>
                </ul>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h3 class="fw-bold mb-4">Reportes Parametrizados con Spring Data JPA</h3>
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-3">
                    <h6 class="fw-bold text-success">Reporte 1: Tutoría por Docente y Asignatura</h6>
                    <form th:action="@{/reportes}" method="GET">
                        <input type="hidden" name="tipo" value="tutoria_docente_materia">
                        <input type="text" name="docente" class="form-control form-control-sm mb-2" placeholder="Docente (Ej: John Carlos)">
                        <input type="text" name="asignatura" class="form-control form-control-sm mb-2" placeholder="Asignatura (Ej: Desarrollo Web)">
                        <button class="btn btn-success btn-sm w-100">Consultar</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-3">
                    <h6 class="fw-bold text-info">Reporte 2: Tutoría por Modalidad o Carrera</h6>
                    <form th:action="@{/reportes}" method="GET">
                        <input type="hidden" name="tipo" value="tutoria_modalidad_carrera">
                        <select name="modalidad" class="form-select form-select-sm mb-2">
                            <option value="">-- Modalidad --</option>
                            <option value="Individual">Individual</option>
                            <option value="Grupal">Grupal</option>
                        </select>
                        <input type="text" name="carrera" class="form-control form-control-sm mb-2" placeholder="Carrera (Ej: Software)">
                        <button class="btn btn-info btn-sm w-100">Consultar</button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${filtroActivo}" class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold" th:text="'Resultados: ' + ${filtroActivo}"></div>
            <div class="card-body p-0">
                <table th:if="${resultadoTutorias}" class="table table-hover mb-0">
                    <thead><tr><th>Docente</th><th>Estudiante</th><th>Asignatura</th><th>Temática</th></tr></thead>
                    <tbody>
                        <tr th:each="t : ${resultadoTutorias}">
                            <td th:text="${t.docente}"></td>
                            <td th:text="${t.estudiante}"></td>
                            <td th:text="${t.asignatura}"></td>
                            <td th:text="${t.tematica}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
