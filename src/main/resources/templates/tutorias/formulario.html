<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Tutoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h4 class="fw-bold text-success mb-3" th:text="${titulo}"></h4>
                    <form th:action="@{/tutorias/guardar}" th:object="${tutoria}" method="POST">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Fecha Registro</label>
                                <input type="date" th:field="*{fecha}" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Fecha Programada</label>
                                <input type="date" th:field="*{fechaProgramada}" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Hora Inicio</label>
                                <input type="time" th:field="*{horaInicio}" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Hora Fin</label>
                                <input type="time" th:field="*{horaFin}" class="form-control" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Docente</label>
                                <input type="text" th:field="*{docente}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Estudiante</label>
                                <input type="text" th:field="*{estudiante}" class="form-control" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Universidad</label>
                                <input type="text" th:field="*{universidad}" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Carrera</label>
                                <input type="text" th:field="*{carrera}" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Asignatura</label>
                                <input type="text" th:field="*{asignatura}" class="form-control" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Modalidad</label>
                                <select th:field="*{esGrupalOIndividual}" class="form-select" required>
                                    <option value="Individual">Individual</option>
                                    <option value="Grupal">Grupal</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Lugar</label>
                                <input type="text" th:field="*{lugar}" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Temática</label>
                            <input type="text" th:field="*{tematica}" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Compromisos</label>
                            <textarea th:field="*{compromisos}" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/tutorias}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
