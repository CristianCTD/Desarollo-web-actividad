<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Tutorías | Spring Boot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/tutorias}"><i class="bi bi-leaf-fill me-2"></i>Tutorías Spring Boot</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/tutorias}">Tutorías</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span class="badge bg-light text-dark me-3 px-3 py-2" th:text="${session.nombre} + ' (' + ${session.rol} + ')'"></span>
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark mb-0">Gestión de Tutorías (Spring Boot 3 + JPA)</h3>
            <a th:href="@{/tutorias/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle me-1"></i>Registrar Tutoría</a>
        </div>

        <div th:if="${param.guardado}" class="alert alert-success py-2 small">Tutoría guardada exitosamente.</div>
        <div th:if="${param.eliminado}" class="alert alert-warning py-2 small">Tutoría eliminada.</div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Docente</th><th>Estudiante</th><th>Asignatura</th><th>Temática</th><th>Fecha Prog.</th><th>Horario</th><th>Modalidad</th><th class="text-center">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${tutorias}">
                            <td class="fw-bold text-muted" th:text="${t.id}"></td>
                            <td class="fw-semibold text-success" th:text="${t.docente}"></td>
                            <td th:text="${t.estudiante}"></td>
                            <td><span class="badge bg-secondary" th:text="${t.asignatura}"></span></td>
                            <td th:text="${t.tematica}"></td>
                            <td th:text="${t.fechaProgramada}"></td>
                            <td><small th:text="${t.horaInicio} + ' - ' + ${t.horaFin}"></small></td>
                            <td><span class="badge bg-info text-dark" th:text="${t.esGrupalOIndividual}"></span></td>
                            <td class="text-center">
                                <a th:href="@{/tutorias/editar/{id}(id=${t.id})}" class="btn btn-outline-warning btn-sm"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/tutorias/eliminar/{id}(id=${t.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Seguro?');"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
