<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios | Spring Boot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/tutorias}">Tutorías Spring Boot</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/tutorias}">Tutorías</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/usuarios}">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Gestión de Usuarios</h3>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-success"><i class="bi bi-person-plus me-1"></i>Nuevo Usuario</a>
        </div>
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th class="text-center">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.nombre}"></td>
                            <td th:text="${u.email}"></td>
                            <td><span class="badge bg-primary" th:text="${u.rol}"></span></td>
                            <td class="text-center">
                                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-outline-warning btn-sm"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Eliminar?');"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
