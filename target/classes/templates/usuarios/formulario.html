<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h4 class="fw-bold text-success mb-3" th:text="${titulo}"></h4>
                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="POST">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nombre Completo</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Contraseña</label>
                            <input type="password" th:field="*{clave}" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Rol</label>
                            <select th:field="*{rol}" class="form-select" required>
                                <option value="Administrador">Administrador</option>
                                <option value="Docente">Docente</option>
                                <option value="Estudiante">Estudiante</option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
